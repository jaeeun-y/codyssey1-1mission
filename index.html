<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 포트폴리오</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="css/style.css">
    <!-- JS 파일 연결 (defer 속성으로 HTML이 모두 읽힌 후 실행되게 함) -->
    <script src="js/main.js" defer></script>
</head>
<body>
    <!-- 헤더 및 네비게이션 -->
    <header>
        <nav>
            <div class="logo">MyPortfolio</div>
            <!-- 모바일용 햄버거 버튼 (나중에 JS로 동작시킬 예정) -->
            <button class="hamburger" aria-label="메뉴 열기">☰</button>
            <ul class="nav-links">
                <li><a href="#hero">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <!-- 다크모드 토글 버튼 -->
            <button id="dark-mode-toggle" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">🌙</button>
        </nav>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main>
        <!-- 1. Hero 섹션 (인사말) -->
        <section id="hero">
            <h1>안녕하세요, 프론트엔드 개발자 OOO입니다.</h1>
            <p>사용자 경험을 중요하게 생각합니다.</p>
            <a href="#contact" class="cta-btn">연락하기</a>
        </section>

        <!-- 2. About 섹션 (자기소개) -->
        <section id="about">
            <h2>About Me</h2>
            <!-- 프로필 이미지가 들어갈 곳 (alt 속성 필수!) -->
            <img src="images/profile.jpg" alt="OOO의 프로필 사진">
            <p>저는 웹 개발을 공부하고 있는 학생입니다...</p>
        </section>

        <!-- 3. Skills 섹션 (기술 스택) -->
        <section id="skills">
            <h2>Skills</h2>
            <ul>
                <li>HTML / CSS</li>
                <li>JavaScript</li>
            </ul>
        </section>

        <!-- 4. Projects 섹션 (깃허브 API로 채워질 곳) -->
        <section id="projects">
        <h2>My Projects</h2>
        <!-- 깃허브 프로젝트가 들어갈 빈 공간 -->
        <div id="github-projects" class="projects-grid">
            <!-- 로딩 중일 때 보여줄 텍스트 -->
            <p>프로젝트를 불러오는 중입니다... ⏳</p>
        </div>
        </section>

        <!-- 5. Contact 섹션 (문의 폼) -->
        <section id="contact">
            <h2>Contact Me</h2>
            <form id="contact-form">
    <div>
      <label for="name">이름</label>
      <input type="text" id="name" placeholder="이름을 입력하세요">
      <span class="error-msg" id="name-error"></span>
    </div>
    
    <div>
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="example@mail.com">
      <span class="error-msg" id="email-error"></span>
    </div>
    
    <div>
      <label for="message">메시지</label>
      <textarea id="message" rows="5" placeholder="내용을 입력하세요"></textarea>
      <span class="error-msg" id="message-error"></span>
    </div>
    
    <button type="submit">전송하기</button>
  </form>
</section>
    </main>

    <!-- 푸터 (저작권 등) -->
    <footer>
        <p>&copy; 2024 OOO. All rights reserved.</p>
    </footer>

    <!-- 스크롤 탑 버튼 -->
    <button id="scroll-top" aria-label="위로 가기">↑</button>
</body>
</html>
